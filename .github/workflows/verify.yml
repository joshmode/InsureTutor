name: Verify security and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_EMBEDDINGS: "false"
      EMBEDDING_ENABLED: "false"
      LLM_API_KEY: ""
      DATA_DIR: /tmp/insuretutor-ci-data
      CHAT_REQUESTS_PER_MINUTE: "120"
      CHAT_REQUESTS_PER_DAY: "2000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node 24
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0; Node 24
        with:
          node-version: "22"
      - name: Install hashed dependencies and verify locks
        run: |
          python -m pip install uv==0.13.9
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          scripts/lock-dependencies.sh --check
          python -m pip check
      - name: Audit the complete Python lock without mutating the app environment
        run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r backend/requirements-dev.txt
      - name: Backend regressions
        run: python -m pytest -q
      - name: Install and build the client
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium firefox webkit
      - name: API, held-out and browser checks
        shell: bash
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8014 --no-proxy-headers --no-access-log > /tmp/insuretutor-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(120):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8014/api/health',timeout=1)
                  break
              except OSError:
                  time.sleep(.5)
          else:
              raise SystemExit('Application did not become ready')
          PY
          python scripts/audit_rag.py --base-url http://127.0.0.1:8014 --output /tmp/adversarial.json
          python scripts/evaluate_provider.py --base-url http://127.0.0.1:8014 --output /tmp/held-out.json
          for browser_engine in chromium firefox webkit; do
            BROWSER_ENGINE="$browser_engine" AUDIT_OUTPUT_DIR="/tmp/browser-$browser_engine" BASE_URL=http://127.0.0.1:8014 node scripts/browser-audit.cjs
            BROWSER_ENGINE="$browser_engine" AUDIT_OUTPUT_DIR="/tmp/second-pass-$browser_engine" BASE_URL=http://127.0.0.1:8014 node scripts/second-pass-ui.cjs
          done
          python scripts/load_smoke.py --base-url http://127.0.0.1:8014 --output /tmp/load.json
      - name: Verify the real pinned hybrid model
        env:
          ENABLE_EMBEDDINGS: "true"
          EMBEDDING_ENABLED: "true"
          EMBEDDING_CACHE_DIR: /tmp/insuretutor-ci-model
          EMBEDDING_LOCAL_MODEL_DIR: /tmp/insuretutor-ci-model/pinned
          DATA_DIR: /tmp/insuretutor-ci-hybrid
        shell: bash
        run: |
          python -m backend.app.scripts.download_embedding_model --revision faf4aa4225822f3bc6376869cb1164e8e3feedd0
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8016 --no-proxy-headers --no-access-log > /tmp/insuretutor-hybrid-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python - <<'PY'
          import json, time, urllib.request
          base = 'http://127.0.0.1:8016'
          for attempt in range(120):
              try:
                  with urllib.request.urlopen(base + '/api/health', timeout=1) as response:
                      health = json.load(response)
                  assert health['retrieval_mode'] == 'hybrid', health
                  break
              except OSError:
                  time.sleep(.5)
          else:
              raise SystemExit('Hybrid application did not become ready')
          for question, language, source_term in [
              ('冷靜期有多長？', 'zh-Hant', '21'),
              ('冷静期有多长？', 'zh-Hans', '21'),
              ('Under this policy, will I pay a withdrawal charge?', 'en', 'US$25'),
          ]:
              request = urllib.request.Request(base + '/api/chat', json.dumps({'message':question, 'language':language}).encode(), {'Content-Type':'application/json'})
              with urllib.request.urlopen(request, timeout=195) as response:
                  answer = json.load(response)
              assert answer['kind'] == 'answer' and answer['citations'], answer
              assert source_term in ' '.join(c['excerpt'] for c in answer['citations'])
              assert answer['model_generated'] is False
          PY
          python scripts/audit_rag.py --base-url http://127.0.0.1:8016 --output /tmp/hybrid-adversarial.json
          python scripts/evaluate_provider.py --base-url http://127.0.0.1:8016 --output /tmp/hybrid-held-out.json
