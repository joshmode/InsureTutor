name: Verify security and regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      ENABLE_EMBEDDINGS: "false"
      EMBEDDING_ENABLED: "false"
      LLM_API_KEY: ""
      DATA_DIR: /tmp/insuretutor-ci-data
      CHAT_REQUESTS_PER_MINUTE: "120"
      CHAT_REQUESTS_PER_DAY: "2000"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Install hashed dependencies and verify locks
        run: |
          python -m pip install uv==0.13.9
          python -m pip install --require-hashes --only-binary=:all: -r backend/requirements-dev.txt
          scripts/lock-dependencies.sh --check
          python -m pip check
      - name: Audit the complete Python lock without mutating the app environment
        run: uvx --from pip-audit==2.10.1 pip-audit --disable-pip --require-hashes -r backend/requirements-dev.txt
      - name: Backend regressions
        run: python -m pytest -q
      - name: Install and build the client
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium firefox webkit
      - name: API, held-out and browser checks
        shell: bash
        run: |
          uvicorn backend.app.main:app --host 127.0.0.1 --port 8014 --no-proxy-headers --no-access-log > /tmp/insuretutor-ci.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(120):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8014/api/health',timeout=1)
                  break
              except OSError:
                  time.sleep(.5)
          else:
              raise SystemExit('Application did not become ready')
          PY
          python scripts/audit_rag.py --base-url http://127.0.0.1:8014 --output /tmp/adversarial.json
          python scripts/evaluate_provider.py --base-url http://127.0.0.1:8014 --output /tmp/held-out.json
          for browser_engine in chromium firefox webkit; do
            BROWSER_ENGINE="$browser_engine" AUDIT_OUTPUT_DIR="/tmp/browser-$browser_engine" BASE_URL=http://127.0.0.1:8014 node scripts/browser-audit.cjs
          done
          python scripts/load_smoke.py --base-url http://127.0.0.1:8014 --output /tmp/load.json
