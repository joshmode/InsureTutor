services:
  insuretutor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
      KNOWLEDGE_BASE_DIR: /app/knowledge
      DATA_DIR: /app/data
      EMBEDDING_CACHE_DIR: /app/data/model-cache
    volumes:
      - insuretutor_data:/app/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    restart: unless-stopped

volumes:
  insuretutor_data:

