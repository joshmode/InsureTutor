services:
  insuretutor:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KNOWLEDGE_BASE_DIR: /app/knowledge
      DATA_DIR: /app/data
      EMBEDDING_CACHE_DIR: /app/data/model-cache
    volumes:
      - insuretutor_data:/app/data
    restart: unless-stopped

volumes:
  insuretutor_data:

